[project]
name = "fleetplanner"
version = "0.1.0"
description = "LLM translates, classical solver plans, validator checks: warehouse robot fleet planning"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gif = ["playwright>=1.40", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fleetplanner"]

[tool.setuptools.package-data]
fleetplanner = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
