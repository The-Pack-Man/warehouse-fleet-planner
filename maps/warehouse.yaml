# Medium warehouse: 5 one-lane aisles between shelf rows, two-lane cross
# corridors north and south, a charging lane on the west edge.
# Coordinates are [x, y] with (0, 0) at the top-left. '#' = wall or shelf.
name: warehouse
start_time: "14:00"
step_seconds: 10          # one grid move per step
grid: |
  #####################
  #...................#
  #...................#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #.##.##.##.##.##.##.#
  #...................#
  #...................#
  #####################

locations:
  # Shelf slots: two per aisle
  A1-1: [4, 4]
  A1-2: [4, 8]
  A2-1: [7, 4]
  A2-2: [7, 8]
  A3-1: [10, 4]
  A3-2: [10, 8]
  A4-1: [13, 4]
  A4-2: [13, 8]
  A5-1: [16, 4]
  A5-2: [16, 8]
  # Pick stations (south) and inbound dock (north-east)
  pick_1: [5, 11]
  pick_2: [10, 11]
  pick_3: [15, 11]
  dock: [18, 1]
  # Chargers in the west lane
  charger_1: [1, 4]
  charger_2: [1, 6]
  charger_3: [1, 8]
  # Robot home positions
  home_1: [2, 11]
  home_2: [7, 11]
  home_3: [12, 11]
  home_4: [18, 11]

zones:                    # [x0, y0, x1, y1], inclusive
  aisle_1: [4, 3, 4, 9]
  aisle_2: [7, 3, 7, 9]
  aisle_3: [10, 3, 10, 9]
  aisle_4: [13, 3, 13, 9]
  aisle_5: [16, 3, 16, 9]
  charging_bay: [1, 3, 1, 9]
  east_lane: [19, 3, 19, 9]
  north_corridor: [1, 1, 19, 2]
  south_corridor: [1, 10, 19, 11]
  dock_area: [16, 1, 19, 2]

robots:
  - {id: R1, home: home_1, battery: 85, capacity: 2}
  - {id: R2, home: home_2, battery: 60, capacity: 2}
  - {id: R3, home: home_3, battery: 95, capacity: 2}
  - {id: R4, home: home_4, battery: 35, capacity: 2}

battery:
  move_cost: 0.5          # % per move
  idle_cost: 0.05         # % per wait step
  charge_rate: 5.0        # % per step at a charger
  reserve: 20             # planner keeps at least this much

# Plain-language context for the language layer. The planner ignores these.
descriptions:
  A1-1: aisle 1, north slot
  A1-2: aisle 1, south slot
  A2-1: aisle 2, north slot
  A2-2: aisle 2, south slot
  A3-1: aisle 3, north slot
  A3-2: aisle 3, south slot
  A4-1: aisle 4, north slot
  A4-2: aisle 4, south slot
  A5-1: aisle 5, north slot
  A5-2: aisle 5, south slot
  pick_1: pick station 1 (south-west)
  pick_2: pick station 2 (south, center)
  pick_3: pick station 3 (south-east)
  dock: inbound dock (north-east), where new stock arrives
  charger_1: charger 1 (west lane)
  charger_2: charger 2 (west lane)
  charger_3: charger 3 (west lane)
  home_1: R1's parking spot
  home_2: R2's parking spot
  home_3: R3's parking spot
  home_4: R4's parking spot
  aisle_1: aisle 1 (one lane)
  aisle_2: aisle 2 (one lane)
  aisle_3: aisle 3 (one lane)
  aisle_4: aisle 4 (one lane)
  aisle_5: aisle 5 (one lane)
  charging_bay: the charging lane on the west wall, chargers 1-3
  east_lane: the lane along the east wall
  north_corridor: the corridor along the north side, including the dock
  south_corridor: the corridor along the south side, including the pick stations and robot parking
  dock_area: the area around the inbound dock

conventions:
  - Restocking moves totes from the dock to an aisle slot. Picking moves totes from an aisle slot to a pick station.
  - When a request names an aisle but not a slot, use the aisle's north slot (-1).
  - Each robot carries up to 2 totes per trip; larger quantities take several trips.
